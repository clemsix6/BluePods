server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    etag on;
    gzip  on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # HTML revalidates on every fetch, so a deploy is visible immediately and
    # costs a 304 when nothing changed.
    add_header Cache-Control "no-cache" always;

    # Astro fingerprints everything it emits here, so the filename changes
    # whenever the bytes do and the cache never has to be invalidated.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
