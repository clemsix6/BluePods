services:
  bluepods-site:
    image: ghcr.io/clemsix6/bluepods-site:latest
    container_name: bluepods-site
    restart: unless-stopped
    # Bound to the loopback only. The tunnel is the sole way in, so the host
    # never opens a port to the internet.
    ports:
      - "127.0.0.1:8083:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bluepods-cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      bluepods-site:
        condition: service_healthy
